# Dependabot opens its PRs from branches named:
#   dependabot/<ecosystem>/<target-branch>/<group-or-dependency>
# e.g. dependabot/bun/develop/minor-and-patch
#      dependabot/github-actions/develop/actions
# (the <target-branch> segment appears because we set target-branch: develop.)

version: 2
updates:
  # Bun dependencies. The "bun" ecosystem updates bun.lock together with package.json; the
  # "npm" one only touched package.json, so CI's `bun install --frozen-lockfile` refused its PRs.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "build(deps)"
    ignore:
      # The Angular toolchain pins TypeScript (Angular 22: >=6.0 <6.1); it moves with Angular.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "angular-*"
          - "@angular-eslint/*"
      spartan:
        patterns:
          - "@spartan-ng/*"
      ng-icons:
        patterns:
          - "@ng-icons/*"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions versions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns:
          - "*"

  # Base image in the Dockerfile
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci(deps)"
