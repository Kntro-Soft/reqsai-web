name: Task
description: Technical or operational work that is not a user-facing story
title: "task: <short description>"
labels: ["task"]
type: Task
projects: ["Kntro-Soft/3"]
body:
  - type: markdown
    attributes:
      value: |
        Work on it in a branch named `feature/<issue-number>-<slug>` and close it from the pull request with `Closes #<issue-number>`.
  - type: textarea
    id: description
    attributes:
      label: What and why
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Verifiable conditions that make the task done.
      value: |
        - [ ] ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Feature module / area
      options:
        - iam
        - billing
        - workspace
        - discovery
        - core
        - shared / ui
        - layout
        - build / ci
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Proposed priority; the team confirms it on the ReqsAI project board.
      options:
        - High
        - Medium
        - Low
    validations:
      required: true
