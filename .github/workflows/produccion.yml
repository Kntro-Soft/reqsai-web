name: Produccion

# A push to main (a merged release/X.Y.Z or hotfix/X.Y.Z pull request):
#   find the candidate vX.Y.Z-rc.N whose tree hash equals this commit's tree (otherwise fail: main differs from
#   what was verified) → approval in produccion → reqsai-infra ships that same digest to the MVP host and this
#   job waits for it → only if it succeeded: the digest is tagged X.Y.Z and latest in GHCR,
#   vX.Y.Z is tagged on this commit with its GitHub Release, and the back-merge pull request main → develop opens.
# Re-running the failed jobs reuses the same candidate. Nothing is rebuilt.
# Switch (organization variable, 'true' = on): ENABLE_REQSAI_WEB_DEPLOY; reqsai-infra adds ENABLE_REQSAI_INFRA_DEPLOY.

on:
  push:
    branches: [main]

concurrency:
  group: produccion-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP: web
  IMAGE: ghcr.io/kntro-soft/reqsai-web
  VERSION_FILE: package.json

jobs:
  prepare:
    name: Find the approved candidate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.find.outputs.version }}
      released: ${{ steps.find.outputs.released }}
      tag: ${{ steps.find.outputs.tag }}
      digest: ${{ steps.find.outputs.digest }}
      candidate: ${{ steps.find.outputs.candidate }}
      deploy_enabled: ${{ steps.switch.outputs.deploy_enabled }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Match this commit's tree with a verified release candidate
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(.github/scripts/candidate.sh version "$VERSION_FILE")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Nothing to release::v$version is already released; this push to main deploys nothing."
            exit 0
          fi
          tree=$(git rev-parse 'HEAD^{tree}')
          json=$(.github/scripts/candidate.sh find "$version" "$tree")
          {
            echo "released=false"
            echo "tag=$(jq -r .tag <<<"$json")"
            echo "digest=$(jq -r .digest <<<"$json")"
            echo "candidate=$json"
          } >> "$GITHUB_OUTPUT"
          echo "### v$version from candidate $(jq -r .tag <<<"$json") (\`$IMAGE@$(jq -r .digest <<<"$json")\`, tree \`${tree:0:12}\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: Read the deploy switch
        id: switch
        env:
          SWITCH: ${{ vars.ENABLE_REQSAI_WEB_DEPLOY }}
        run: |
          if [ "$SWITCH" = true ]; then
            echo "deploy_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_enabled=false" >> "$GITHUB_OUTPUT"
            msg="ENABLE_REQSAI_WEB_DEPLOY is not 'true': nothing is deployed and the version is not tagged. Turn it on and re-run all jobs (Kntro-Soft → Settings → Secrets and variables → Actions → Variables)."
            echo "::warning title=Deploy skipped::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Deploy to produccion
    needs: prepare
    if: needs.prepare.outputs.released == 'false' && needs.prepare.outputs.deploy_enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: produccion
      url: ${{ vars.APP_URL }}
    concurrency:
      group: produccion-reqsai-web
      cancel-in-progress: false
    outputs:
      url: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the release bot configuration
        env:
          APP_ID: ${{ vars.RELEASE_APP_ID }}
          HAS_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          if [ -z "$APP_ID" ] || [ "$HAS_KEY" != true ]; then
            echo "::error title=Release bot not configured::The organization variable RELEASE_APP_ID and the organization secret RELEASE_APP_PRIVATE_KEY (GitHub App reqsai-release-bot) are required to ask reqsai-infra for the deploy."
            exit 1
          fi

      # A token for reqsai-infra only, with Actions: write (workflow_dispatch of deploy-mvp.yml); it expires in one
      # hour, so the run is watched with the workflow token (reqsai-infra is public).
      - name: Mint the release bot token for reqsai-infra
        id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # The App ID; GitHub accepts it as the JWT issuer like the client ID.
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: Kntro-Soft
          repositories: reqsai-infra
          permission-actions: write

      - name: Ship the candidate digest through reqsai-infra and wait for it
        env:
          DISPATCH_TOKEN: ${{ steps.bot.outputs.token }}
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.prepare.outputs.digest }}
          REQUEST_ID: reqsai-web ${{ needs.prepare.outputs.tag }} ${{ github.run_id }}-${{ github.run_attempt }}
        run: .github/scripts/deploy-via-infra.sh "$APP" "$DIGEST" "$GITHUB_SHA" "$REQUEST_ID"

  release:
    name: Tag v${{ needs.prepare.outputs.version }} and back-merge
    needs: [prepare, deploy]
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # tag vX.Y.Z and its GitHub Release
      packages: write # X.Y.Z and latest in GHCR; the back-merge pull request is opened by reqsai-release-bot
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Label the deployed digest X.Y.Z and latest in GHCR (no rebuild)
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          VERSION: ${{ needs.prepare.outputs.version }}
          DIGEST: ${{ needs.prepare.outputs.digest }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          docker buildx imagetools create --tag "$IMAGE:$VERSION" --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
          docker logout ghcr.io
          echo "\`$IMAGE:$VERSION\` and \`:latest\` → \`$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish v${{ needs.prepare.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
          APP_URL: ${{ needs.deploy.outputs.url }}
        run: |
          jq --arg url "$APP_URL" '. + {production_url: $url}' <<<"$CANDIDATE" > "$RUNNER_TEMP/candidate.json"
          url=$(.github/scripts/candidate.sh final "$RUNNER_TEMP/candidate.json" "$GITHUB_SHA")
          echo "Released: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the release bot configuration
        env:
          APP_ID: ${{ vars.RELEASE_APP_ID }}
          HAS_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          if [ -z "$APP_ID" ] || [ "$HAS_KEY" != true ]; then
            echo "::error title=Release bot not configured::The organization variable RELEASE_APP_ID and the organization secret RELEASE_APP_PRIVATE_KEY (GitHub App reqsai-release-bot) are required to open the back-merge pull request. Nothing falls back to GITHUB_TOKEN: its pull requests start no workflows."
            exit 1
          fi

      - name: Mint the release bot token
        id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # The App ID; GitHub accepts it as the JWT issuer like the client ID.
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write # auto-merge
          permission-pull-requests: write
          permission-workflows: write # auto-merge of a back-merge that changes .github/workflows

      - name: Open the back-merge pull request into develop as reqsai-release-bot
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          body="$RUNNER_TEMP/back-merge.md"
          {
            echo "Gitflow back-merge of release $VERSION, now tagged [v$VERSION]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$VERSION) and deployed."
            echo
            echo "Brings the fixes made on the release or hotfix branch (and its version bump) back into \`develop\`. Merge it with a merge commit, never a squash, so \`develop\` keeps \`main\`'s history."
          } > "$body"
          url=$(.github/scripts/candidate.sh pr main develop "chore: merge release $VERSION back into develop" "$body")
          if [ -z "$url" ]; then
            echo "Back-merge: not needed" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Back-merge: $url ($(.github/scripts/candidate.sh automerge "$url"))" >> "$GITHUB_STEP_SUMMARY"
