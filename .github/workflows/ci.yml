name: CI

# Pull requests, and pushes to the Gitflow branches: the release pull request is opened by the GitHub App
# reqsai-release-bot, so it gets its own pull_request run, and the push to release/** or hotfix/** checks the same
# head commit. release.yml reuses it (workflow_call) so a candidate is only built from a commit that passed CI.
on:
  pull_request:
  push:
    branches: [ develop, main, 'release/**', 'hotfix/**' ]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium browser
        run: bunx playwright install chromium --with-deps

      - name: Lint (ESLint + angular-eslint)
        run: bun run lint

      - name: Check i18n key parity (en/es in sync)
        run: bun run i18n:check

      - name: Unit tests (Vitest)
        run: bun run test:ci
        env:
          CI: true

      - name: Build (production)
        run: bun run build

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
