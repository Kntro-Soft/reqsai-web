name: Tag release

# After a release/X.Y.Z or hotfix/X.Y.Z pull request is merged into main, tag vX.Y.Z on the commit that was
# deployed to produccion (the pull request head) and publish its GitHub Release. Refuses to tag a commit
# without a successful produccion deployment.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  tag:
    name: Tag the deployed commit
    if: >-
      github.event.pull_request.merged == true &&
      (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      deployments: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          version=$(.github/scripts/release-version.sh "$BRANCH")
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists"
            exit 1
          fi

          deployed=false
          for id in $(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=produccion&sha=$HEAD_SHA&per_page=30" --jq '.[].id'); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1" --jq '.[0].state')
            if [ "$state" = success ]; then deployed=true; break; fi
          done
          if [ "$deployed" != true ]; then
            echo "::error::${HEAD_SHA:0:12} has no successful produccion deployment; deploy it before tagging $tag"
            exit 1
          fi

          notes="$RUNNER_TEMP/notes.md"
          {
            echo "Deployed to **produccion** from \`$BRANCH\` (#$PR_NUMBER)."
            echo
            echo "- Commit: \`$HEAD_SHA\`"
            echo "- Image: \`ghcr.io/kntro-soft/${GITHUB_REPOSITORY#*/}:$HEAD_SHA\`"
            echo
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$tag" -f target_commitish="$HEAD_SHA" --jq .body
          } > "$notes"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$HEAD_SHA" --title "$tag" --notes-file "$notes"
          echo "Released [$tag]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag) on \`$HEAD_SHA\`." >> "$GITHUB_STEP_SUMMARY"

          missing=$(gh api "repos/$GITHUB_REPOSITORY/compare/develop...$HEAD_SHA" --jq .ahead_by)
          if [ "$missing" = 0 ]; then
            echo "develop already contains \`$BRANCH\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/develop...$BRANCH?expand=1"
          echo "::notice title=Back-merge into develop::$url"
          echo "Gitflow back-merge: [open \`$BRANCH\` → \`develop\`]($url) ($missing commits are not in develop yet)." >> "$GITHUB_STEP_SUMMARY"
